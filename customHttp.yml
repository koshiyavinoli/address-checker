# Response headers for AWS Amplify Hosting.
# connect-src allows the API Gateway endpoint (*.amazonaws.com); tighten it to
# your exact execute-api host once it is known.
customHeaders:
  - pattern: "**/*"
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: geolocation=(), camera=(), microphone=()
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
          style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
          img-src 'self' data: https://*.tile.openstreetmap.org https://cdnjs.cloudflare.com;
          connect-src 'self' https://*.amazonaws.com;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self'
