<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Address Coverage Checker</title>
  <meta name="description" content="Check whether a New Zealand address falls inside a configurable coverage polygon." />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Address Coverage Checker</h1>
      <p class="app__subtitle" id="subtitle">
        Enter an address to check whether it falls <strong>strictly inside</strong> the coverage zone.
      </p>
    </header>

    <form id="search-form" class="search" autocomplete="off">
      <label class="search__label" for="address">New Zealand address</label>
      <div class="combo">
        <input
          id="address"
          name="address"
          type="text"
          class="search__input"
          placeholder="Start typing a New Zealand address…"
          maxlength="200"
          spellcheck="false"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="suggestions"
          aria-describedby="address-hint"
          required
        />
        <ul id="suggestions" class="suggestions" role="listbox" aria-label="Address suggestions" hidden></ul>
      </div>
      <p id="address-hint" class="search__hint">
        Format: unit/number street, suburb, town or city, postcode.
        For example: <span class="search__example">2/15 Queen Street, Auckland Central, Auckland 1010</span>
      </p>
      <div class="search__actions">
        <button id="check-btn" type="submit" class="search__button">Check</button>
        <button id="clear-btn" type="button" class="search__button search__button--ghost">Clear</button>
      </div>
      <div class="examples" id="examples" hidden></div>
    </form>

    <section id="candidates" class="candidates" aria-labelledby="candidates-title" hidden>
      <p id="candidates-title" class="candidates__title">More than one address matches. Pick the one you mean:</p>
      <ul id="candidates-list" class="candidates__list"></ul>
    </section>

    <section id="result" class="result" aria-live="polite" hidden>
      <div class="result__badge" id="result-badge"></div>
      <div class="result__details">
        <p id="result-headline" class="result__headline"></p>
        <p id="result-address" class="result__address"></p>
        <p id="result-meta" class="result__meta"></p>
        <button id="retry-btn" type="button" class="result__retry" hidden>Try again</button>
      </div>
    </section>

    <div id="map" class="map" role="img" aria-label="Map of the coverage zone"></div>
  </main>

  <!-- Map + geospatial libraries (UMD globals, loaded before the module) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/turf.min.js"></script>

  <script type="module" src="app.js"></script>
</body>
</html>
